<!DOCTYPE html>
<html>
<head>
    <title>Socket Test</title>

    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

</head>

<body>

<h2>WebSocket Test</h2>

<button onclick="connect()">Connect</button>
<button onclick="send()">Send</button>

<ul id="messages"></ul>

<script>

let stompClient = null;

function connect() {

    const socket = new WebSocket("ws://localhost:8080/api/v1/ws");

    stompClient = Stomp.over(socket);

    stompClient.connect({
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuaHV0dGFuMzczQGdtYWlsLmNvbSIsInR5cGUiOiJBQ0NFU1MiLCJpYXQiOjE3NzI1OTgzMzAsImV4cCI6MTc3Mjk1ODMzMH0.jiHPkjx-08StpPrQL--dUT2NmBYdu5QggMCfukpe0Do"
    }, function () {

        console.log("Connected");

        stompClient.subscribe("/topic/notifications", function (message) {

            const data = JSON.parse(message.body);

            const li = document.createElement("li");
            li.innerText = data.title + " - " + data.content;

            document.getElementById("messages").appendChild(li);

        });

    });
}

function send() {

    stompClient.send("/app/notify", {}, JSON.stringify({
        title: "Test",
        content: "WebSocket works!"
    }));

}

</script>

</body>
