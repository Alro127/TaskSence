networks:
  tasksense_net:
    name: tasksense_net

services:
  postgres:
    image: postgres:16
    container_name: task_postgres
    restart: always
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - tasksense_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:9
    container_name: task_flyway
    command: >
      -url=jdbc:postgresql://postgres:5432/taskdb
      -user=postgres
      -password=postgres
      -connectRetries=60
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tasksense_net

  seed:
    image: postgres:16
    container_name: task_seed
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./src/main/resources/db/seed:/seed
    command: psql -h postgres -U postgres -d taskdb -f /seed/seed_data.sql
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - tasksense_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: task_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - tasksense_net
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: task_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tasksense_net
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: tasksense_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - tasksense_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: tasksense_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tasksense_net

volumes:
  postgres_data:
  redis_data:
