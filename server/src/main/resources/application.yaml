spring:
  application:
    name: TaskSense
    backend-url: http://localhost:8080
    frontend-url: http://localhost:5173

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb?options=-c%20TimeZone=Asia/Ho_Chi_Minh
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Hibernate chỉ check schema
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        name: tasksense-mcp-server
        version: 1.0.0
        instructions: TaskSense MCP server for task and project execution tools
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp

aws:
  region: ${AWS_REGION:}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  bucket: ${AWS_BUCKET:}
  endpoint: ${AWS_ENDPOINT:}

server:
  port: 8080
  servlet:
    context-path: /api/v1
  origin-allows:
    - http://localhost:3000
    - http://localhost:5173
    - https://tasksense.app

security:
  jwt:
    secret: my-super-secret-key-which-is-very-long-123456
    short-expiration: 360000000
    long-expiration: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URL:http://localhost:5173}

logging:
  level:
    org.springframework.security: DEBUG
#    org.springframework.boot.autoconfigure.jdbc: DEBUG
#    com.zaxxer.hikari: DEBUG
#    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
